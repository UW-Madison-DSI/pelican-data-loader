[server]
port = 8501
# enableCORS must stay true while enableXsrfProtection is true; Streamlit
# overrides it otherwise and logs a warning on every start.
enableXsrfProtection = true

[browser]
gatherUsageStats = false

[theme]
primaryColor = "#FF6B35"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F0F2F6"
textColor = "#262730"
font = "sans serif"
