{# A copyable snippet. Expects `code`, optionally `label`. #}
<div class="relative group">
  {% if label %}<div class="mb-1 text-xs font-medium text-base-content/60">{{ label }}</div>{% endif %}
  <pre class="rounded-box bg-neutral text-neutral-content overflow-x-auto p-4 text-sm leading-relaxed"><code>{{ code }}</code></pre>
  <button type="button"
          class="btn btn-xs btn-neutral absolute top-2 right-2 opacity-0 group-hover:opacity-100 focus-visible:opacity-100 transition-opacity"
          data-copy>Copy</button>
</div>
